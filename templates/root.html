<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Levent Arican</title>
    
    <meta name="author" content="Levent Arican">
    <meta name="description" content="Software Craftsman, Software Engineering, Computer Vision, Data Engineering, AI Engineering, Computer Science, Machine Learning, Deep Learning, Android Development, Kotlin, Java, Rust, Python">
    <meta http-equiv="cache-control" content="no-cache"/>

    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --fg: #1a1a1a;
            --link: #0645ad;
            --link-visited: #5a3696;
            --muted: #c0c0c0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1b1b1d;
                --fg: #e2e2e2;
                --link: #8ab4f8;
                --link-visited: #c58af9;
                --muted: #6b6b6b;
            }
            img {
                /* diagrams/screenshots are often transparent with dark lines */
                background: #ffffff;
            }
        }
        body {
            line-height: 1.6;
            background: var(--bg);
            color: var(--fg);
        }
        a {
            color: var(--link);
        }
        a:visited {
            color: var(--link-visited);
        }
        h1 {
            font-size: 1.6em;
        }
        h2 {
            font-size: 1.4em;
        }
        h3 {
            font-size: 1.2em;
        }
        code {
            font-size: large;
        }
        blockquote {
            font-style: italic;
        }
        table, th, td {
            border: solid 1px;
        }
        footer {
            color: var(--muted)
        }
        .container {
            max-width: 760px;
            margin: 16px auto;
            padding: 0 16px;
            overflow-wrap: break-word;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        pre {
            overflow-x: auto;
            padding: 12px 16px;
            border-radius: 6px;
            line-height: 1.4;
        }
        table {
            display: block;
            max-width: 100%;
            overflow-x: auto;
            border-collapse: collapse;
        }
        @media (max-width: 600px) {
            code {
                font-size: medium;
            }
        }
    </style>

    <section class="section">
        <div class="container">
            {% block content %} {% endblock %}
        </div>
    </section>
